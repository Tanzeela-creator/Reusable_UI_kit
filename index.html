<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reusable UI Kit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Reusable UI Kit</h1>
        <p>Component Thinking with Vanilla JavaScript</p>
    </header>

    <main>

        <!-- Buttons -->
        <section>
            <h2>Buttons</h2>
            <div id="buttonDemo" class="demo-area"></div>
        </section>

        <!-- Cards -->
        <section>
            <h2>Cards</h2>
            <div id="cardDemo" class="card-container"></div>
        </section>

        <!-- Modal -->
        <section>
            <h2>Modal</h2>
            <div id="modalDemo"></div>
        </section>

        <!-- Toast -->
        <section>
            <h2>Toast Notifications</h2>
            <div id="toastDemo" class="demo-area"></div>
        </section>

    </main>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
